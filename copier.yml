_min_copier_version: "9.0.0"
_subdirectory: templates
_envops:
  trim_blocks: true
  lstrip_blocks: true
_exclude:
  - _partials
  - >-
    {% if not ('native' in components or 'plugin_generation' in components or
    'plugin_patching' in components or 'interface' in components or
    devbench_tests) %}.vscode/settings.json{% endif %}
_skip_if_exists:
  - .xmake/bmk/deploy.json
  - "{{ mutagen_source }}/FormIDs.txt"

project_name:
  type: str
  help: Project name
  default: MyMod
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9_-]*$')) %} Use
    letters, digits, underscores or dashes, starting with a letter. {% endif %}

game:
  type: str
  help: Game
  choices:
    Skyrim: skyrim
    Fallout 4: fallout4
  default: skyrim

components:
  type: str
  help: Components to build
  multiselect: true
  choices:
    "{{ 'SKSE' if game == 'skyrim' else 'F4SE' }} plugin (.dll)": native
    Papyrus: papyrus
    Build UI files (.swf) with FFDec: interface
    Generate an ESP with Mutagen: plugin_generation
    Run a Synthesis patcher: plugin_patching
  default: []

description:
  type: str
  help: Short project description
  default: ""

author:
  type: str
  help: Author
  default: ""

pre_commit:
  type: bool
  help: Include pre-commit formatting and lint hooks
  default: true

native_settings:
  type: bool
  help: Include native INI settings
  default: false
  when: "{{ 'native' in components }}"

mcm:
  type: bool
  help: >-
    Include an optional MCM addon (adds Papyrus and Mutagen). {% if
    'plugin_generation' in components %}Its ESP replaces the main ESP. Publish
    both ZIPs together.{% else %}The generated ESP goes in the addon.{% endif %}
  default: false
  when: "{{ 'native' in components and native_settings }}"

native_source:
  type: str
  help: Native source directory
  default:
    "{{ 'src' if components | length == 1 and not mcm else 'src/native' }}"
  when: "{{ 'native' in components }}"

papyrus_source:
  type: str
  help: Papyrus source directory
  default: src/papyrus
  when: "{{ 'papyrus' in components or mcm }}"

interface_source:
  type: str
  help: Interface source directory
  default: src/interface
  when: "{{ 'interface' in components }}"

mutagen_source:
  type: str
  help: Mutagen project directory
  default: "src/mutagen/{{ project_name }}"
  when: "{{ 'plugin_generation' in components or mcm }}"

synthesis_source:
  type: str
  help: Synthesis project directory
  default: "src/synthesis/{{ project_name }}Patch"
  when: "{{ 'plugin_patching' in components }}"

clib_util:
  type: bool
  help: Include CLibUtil
  default: true
  when: "{{ 'native' in components and not native_settings }}"

devbench_tests:
  type: bool
  help: Include DevBench tests using pytest
  default: false
  when: "{{ game == 'skyrim' }}"

devbench_api:
  type: bool
  help: Include the DevBench native API and BMK helpers
  default: false
  when: "{{ game == 'skyrim' and 'native' in components }}"

bmk_repository:
  type: str
  help: BMK package repository (URL or local directory)
  default: https://github.com/gabriel-andreescu/BethesdaModKit.git

pack_assets:
  type: bool
  help: Create BSA/BA2 archives
  default: false

deploy:
  type: str
  help: Initial deployment directories separated by ; (leave blank to disable)
  default: ""
